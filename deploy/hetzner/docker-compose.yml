services:
  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${API_DATABASE_URL:-${DATABASE_URL}}
      NODE_ENV: production
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      ADMIN_API_TOKEN_SHA256: ${ADMIN_API_TOKEN_SHA256:-}
      ADMIN_POSTGREST_URL: ${ADMIN_POSTGREST_URL:-}
      ADMIN_POSTGREST_API_KEY: ${ADMIN_POSTGREST_API_KEY:-}
      PORT: 3000
    # Coolify's managed PostgreSQL DNS name is available only on `coolify`.
    # No port or reverse-proxy label is published for this service.
    networks: [vezvision_internal, coolify]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgrest:
    image: postgrest/postgrest:v14.1@sha256:e9490aa503a5fb07d8e8c80da46e5c0c193894e583b59ed9077e74c4101ffae2
    restart: unless-stopped
    environment:
      PGRST_DB_URI: ${POSTGREST_DATABASE_URL:-${DATABASE_URL}}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: 3001
    networks: [vezvision_internal, coolify]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
  gateway:
    build:
      context: ../..
      dockerfile: backend/nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgrest:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [vezvision_internal, coolify]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  vezvision_internal:
    internal: true
  coolify:
    external: true
