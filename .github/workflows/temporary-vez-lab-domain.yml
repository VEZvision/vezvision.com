name: Temporary VEZ lab domain finalize

on:
  workflow_dispatch:

jobs:
  finalize:
    runs-on: [self-hosted, Linux, X64, vezlab-vezvision-deploy]
    steps:
      - name: Keep VEZ lab on vezlabs.dev
        env:
          LAB_ROOT_KEY: ${{ secrets.VEZ_TEMP_LAB_ROOT_KEY }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vez-lab-domain"
          mkdir -p "$work"
          chmod 700 "$work"
          printf '%s\n' "$LAB_ROOT_KEY" > "$work/lab-root"
          chmod 600 "$work/lab-root"
          ssh_opts=(-i "$work/lab-root" -o BatchMode=yes -o StrictHostKeyChecking=no)
          raw_token="$(openssl rand -hex 32)"
          token_hash="$(printf '%s' "$raw_token" | sha256sum | awk '{print $1}')"
          sql="insert into personal_access_tokens (tokenable_type, tokenable_id, name, token, abilities, created_at, updated_at) values ('App\\Models\\User', (select id from users order by id limit 1), 'codex-vez-lab-domain', '$token_hash', '[\"*\"]', now(), now()) returning id;"
          token_id="$(printf '%s' "$sql" | base64 | ssh "${ssh_opts[@]}" root@10.77.30.35 'base64 -d | docker exec -i coolify-db psql -U coolify -d coolify -At' | head -n 1)"
          cleanup() {
            ssh "${ssh_opts[@]}" root@10.77.30.35 "docker exec coolify-db psql -U coolify -d coolify -c \"delete from personal_access_tokens where name='codex-vez-lab-domain';\"" >/dev/null || true
            find "$work" -type f -exec unlink {} \;
          }
          trap cleanup EXIT
          COOLIFY_TOKEN="$token_id|$raw_token"
          app_uuid='gjw76qejdx4vq1oqnzxn0x5e'
          api='https://coolify.vezlabs.dev/api/v1'
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"domains":"https://website.vezlabs.dev"}' \
            "$api/applications/$app_uuid" >/dev/null
          curl -fsS \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$api/applications/$app_uuid" \
            | jq '{name, uuid, git_branch, domains, status}'
          curl -fsS \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$api/deploy?uuid=$app_uuid&force=false" \
            | jq '{message, deployment_uuid}'
