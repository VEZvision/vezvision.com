name: Temporary VEZ lab route inspection

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, vezlab-vezvision-deploy]
    steps:
      - name: Inspect lab routing
        env:
          OPENWRT_KEY: ${{ secrets.VEZ_TEMP_OPENWRT_KEY }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vez-route-inspection"
          mkdir -p "$work"
          chmod 700 "$work"
          printf '%s\n' "$OPENWRT_KEY" > "$work/openwrt"
          chmod 600 "$work/openwrt"
          echo '--- routes ---'
          ip route
          echo '--- addresses ---'
          ip -brief address
          echo '--- neighbours ---'
          ip neigh
          echo '--- router probes ---'
          candidates="$(ip route | awk '/^default / {print $3}') $(ip neigh | awk '{print $1}') 192.168.2.1 10.77.0.1 10.77.10.1 10.77.20.1 10.77.30.1 10.77.40.1"
          for candidate in $candidates; do
            printf '%s ' "$candidate"
            ssh -i "$work/openwrt" -o BatchMode=yes -o ConnectTimeout=2 -o StrictHostKeyChecking=no "root@$candidate" 'ubus call system board | jsonfilter -e "@.hostname"' 2>/dev/null || echo unavailable
          done
          find "$work" -type f -exec unlink {} \;
