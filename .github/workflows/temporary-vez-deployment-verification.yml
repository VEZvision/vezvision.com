name: Temporary VEZ deployment verification

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, vezlab-vezvision-deploy]
    steps:
      - name: Verify VEZ develop deployment
        env:
          LAB_ROOT_KEY: ${{ secrets.VEZ_TEMP_LAB_ROOT_KEY }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vez-deploy-verification"
          mkdir -p "$work"
          chmod 700 "$work"
          printf '%s\n' "$LAB_ROOT_KEY" > "$work/lab-root"
          chmod 600 "$work/lab-root"
          ssh -i "$work/lab-root" -o BatchMode=yes -o StrictHostKeyChecking=no root@10.77.30.35 'docker exec coolify-db psql -U coolify -d coolify -At -F "|" -c "select status,commit,created_at,finished_at from application_deployment_queues where application_id=(select id::text from applications where uuid='"'"'gjw76qejdx4vq1oqnzxn0x5e'"'"') order by id desc limit 1;"; docker ps --format "{{.Names}}|{{.Status}}|{{.Image}}" | grep gjw76qejdx4vq1oqnzxn0x5e || true'
          find "$work" -type f -exec unlink {} \;
