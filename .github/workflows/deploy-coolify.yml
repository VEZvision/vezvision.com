name: Deploy to Coolify

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options:
          - develop
          - production

permissions:
  contents: read

concurrency:
  group: coolify-${{ github.event.workflow_run.head_branch || inputs.environment }}
  cancel-in-progress: false

jobs:
  develop:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'develop')
    runs-on: [self-hosted, Linux, X64, vezlab-vezvision-deploy]
    timeout-minutes: 5
    environment: develop
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify tested develop commit is still the branch tip
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git ls-remote origin refs/heads/develop | cut -f1)" = "$EXPECTED_SHA"
      - name: Deploy develop API
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_DEVELOP_API_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_DEVELOP_API_TOKEN }}
        run: ./scripts/trigger-coolify-deploy.sh
      - name: Deploy develop frontend
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_DEVELOP_FRONTEND_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_DEVELOP_API_TOKEN }}
        run: ./scripts/trigger-coolify-deploy.sh

  production:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify tested production commit is still the branch tip
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
      - name: Deploy production API
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_PRODUCTION_API_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_PRODUCTION_API_TOKEN }}
        run: ./scripts/trigger-coolify-deploy.sh
      - name: Deploy production frontend
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_PRODUCTION_FRONTEND_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_PRODUCTION_API_TOKEN }}
        run: ./scripts/trigger-coolify-deploy.sh
