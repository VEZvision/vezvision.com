name: Temporary VEZ lab inspection

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, vezlab-vezvision-deploy]
    steps:
      - name: Verify privileged lab channel
        env:
          LAB_ROOT_KEY: ${{ secrets.VEZ_TEMP_LAB_ROOT_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/vez-lab-root"
          printf '%s\n' "$LAB_ROOT_KEY" > "$key"
          chmod 600 "$key"
          ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=no root@10.77.30.35 \
            'printf "root_channel=yes host=%s coolify=%s\n" "$(hostname)" "$(docker inspect coolify --format "{{.Config.Image}}")"; docker exec coolify-db psql -U coolify -d coolify -At -F "|" -c "select p.uuid,p.name,e.uuid,e.name from projects p join environments e on e.project_id=p.id order by p.id,e.id;"'
          unlink "$key"
