name: Temporary VEZ lab finalize

on:
  workflow_dispatch:

jobs:
  finalize:
    runs-on: [self-hosted, Linux, X64, vezlab-vezvision-deploy]
    steps:
      - name: Finalize VEZ lab deployment
        env:
          LAB_ROOT_KEY: ${{ secrets.VEZ_TEMP_LAB_ROOT_KEY }}
          OPENWRT_KEY: ${{ secrets.VEZ_TEMP_OPENWRT_KEY }}
          VEZHQ_ADMIN_TOKEN: ${{ secrets.VEZ_TEMP_GITHUB_ADMIN_TOKEN }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEVELOP_API_TOKEN }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vez-finalize"
          mkdir -p "$work"
          chmod 700 "$work"
          printf '%s\n' "$LAB_ROOT_KEY" > "$work/lab-root"
          printf '%s\n' "$OPENWRT_KEY" > "$work/openwrt"
          chmod 600 "$work"/*
          ssh_opts=(-i "$work/lab-root" -o BatchMode=yes -o StrictHostKeyChecking=no)
          app_uuid="$(ssh "${ssh_opts[@]}" root@10.77.30.35 'sed -n "1p" /root/.vez_develop_app_uuid')"

          router_host=''
          for candidate in 192.168.2.1 10.77.0.1 10.77.10.1 10.77.20.1 10.77.30.1 10.77.40.1; do
            if ssh -i "$work/openwrt" -o BatchMode=yes -o ConnectTimeout=2 -o StrictHostKeyChecking=no "root@$candidate" 'ubus call system board >/dev/null' 2>/dev/null; then
              router_host="$candidate"
              break
            fi
          done
          if [ -n "$router_host" ]; then
            ssh -i "$work/openwrt" -o BatchMode=yes -o StrictHostKeyChecking=no "root@$router_host" 'sh -s' <<'ROUTER'
          set -eu
          ensure_domain() {
            domain="$1"
            section="$(uci show dhcp | sed -n "s/^dhcp\.\([^.=]*\)\.name='$domain'$/\1/p" | head -1)"
            if [ -z "$section" ]; then section="$(uci add dhcp domain)"; fi
            uci set "dhcp.$section.name=$domain"
            uci set "dhcp.$section.ip=10.77.30.35"
          }
          ensure_domain website.vezhq.com
          ensure_domain website.vezlabs.dev
          uci commit dhcp
          /etc/init.d/dnsmasq restart
          ROUTER
            printf 'router_dns=updated host=%s\n' "$router_host"
          else
            echo 'router_dns=management_interface_not_reachable'
          fi

          gh_version=2.95.0
          curl -fsSL "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_amd64.tar.gz" -o "$work/gh.tgz"
          tar -xzf "$work/gh.tgz" -C "$work"
          gh_bin="$work/gh_${gh_version}_linux_amd64/bin/gh"
          printf '%s' "$COOLIFY_DEPLOY_TOKEN" | GH_TOKEN="$VEZHQ_ADMIN_TOKEN" "$gh_bin" secret set COOLIFY_DEVELOP_API_TOKEN --repo VEZhq/vezhq.com
          printf '%s' "https://coolify.vezlabs.dev/api/v1/deploy?uuid=$app_uuid&force=false" | GH_TOKEN="$VEZHQ_ADMIN_TOKEN" "$gh_bin" secret set COOLIFY_DEVELOP_WEBHOOK_URL --repo VEZhq/vezhq.com
          echo 'vezhq_deploy_secrets=configured'

          ssh "${ssh_opts[@]}" root@10.77.30.35 "docker exec coolify-db psql -U coolify -d coolify -At -F '|' -c \"select status,commit,created_at,finished_at from application_deployment_queues where application_id=(select id::text from applications where uuid='$app_uuid') order by id desc limit 1;\""
          find "$work" -type f -exec unlink {} \;
