name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.example.test
      SKIP_PRERENDER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Knip (dead code detection — advisory)
        run: npm run knip -- --no-exit-code

      - name: Typecheck, parity, and unit tests
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload production dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json 2>/dev/null | node -e '
            const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const SKIP = new Set(["GHSA-qwww-vcr4-c8h2"]);
            const vulns = data.vulnerabilities || {};
            const filtered = new Set();
            let changed = true;
            while (changed) {
              changed = false;
              for (const [name, v] of Object.entries(vulns)) {
                if (filtered.has(name)) continue;
                const vias = Array.isArray(v.via) ? v.via : [v.via];
                const allSkipped = vias.length > 0 && vias.every(via => {
                  if (typeof via === "string") return filtered.has(via);
                  if (via.source && SKIP.has(via.source)) return true;
                  if (via.url && via.url.includes("GHSA-qwww-vcr4-c8h2")) return true;
                  return false;
                });
                if (allSkipped) { filtered.add(name); changed = true; }
              }
            }
            const real = Object.entries(vulns).filter(([n]) => !filtered.has(n));
            if (real.length > 0) {
              for (const [name, v] of real) console.error(name + ": " + v.severity);
              process.exit(1);
            }
            console.log("No production vulnerabilities");
          '

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    env:
      VITE_API_URL: https://api.example.test
      SKIP_PRERENDER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download production dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: E2E smoke tests (production build)
        run: npm run test:e2e -- --project=chromium --grep-invert "Route error boundary"
        env:
          CI: true
          E2E_USE_PREBUILT_DIST: "1"

      - name: E2E smoke tests (Firefox)
        run: npm run test:e2e:prebuilt -- --project=firefox --grep-invert "Route error boundary"
        env:
          CI: true
          E2E_USE_PREBUILT_DIST: "1"

      - name: E2E route error boundary (E2E build)
        run: npm run test:e2e -- tests/e2e/route-error.spec.ts --project=chromium
        env:
          CI: true

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    if: vars.LIGHTHOUSE_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.example.test

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./.github/lighthouserc.json
